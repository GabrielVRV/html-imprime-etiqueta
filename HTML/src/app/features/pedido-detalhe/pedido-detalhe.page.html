<po-page-default [p-title]="'Pedido ' + nrPedido()" [p-breadcrumb]="breadcrumb()">
  @if (pedido(); as pedido) {
    <section class="app-cartao app-secao resumo">
      <po-info p-label="Cliente" [p-value]="pedido.nomeAbrev" />
      <po-info p-label="Pedido do cliente" [p-value]="pedido.nrPedCli" />
      <po-info p-label="Entrega" [p-value]="(pedido.dataEntrega | date: 'dd/MM/yyyy') ?? ''" />
      <po-info p-label="Ordens" p-value="{{ pedido.qtdOrdens }}" />
      <po-info p-label="Itens pendentes" p-value="{{ pedido.qtdItensPendentes }}" />
      <div class="progresso">
        <app-progresso-separacao [percentual]="percentual()" />
      </div>
    </section>
  }

  <section class="app-cartao">
    <po-table
      [p-columns]="colunas()"
      [p-items]="linhas()"
      [p-loading]="carregando()"
      [p-hide-columns-manager]="true"
      [p-text-wrap]="true"
    >
    </po-table>
  </section>
</po-page-default>
