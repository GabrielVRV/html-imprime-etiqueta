<po-page-list p-title="Etiquetas para separação" [p-filter]="pesquisa" [p-actions]="acoesPagina">
  <section class="app-cartao">
    <po-table
      [p-columns]="colunas()"
      [p-items]="pedidos()"
      [p-loading]="carregando()"
      [p-hide-columns-manager]="true"
      [p-text-wrap]="true"
      [p-literals]="{ noData: 'Nenhum pedido com itens pendentes' }"
    />
  </section>
</po-page-list>
